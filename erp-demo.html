Panduan untuk siapa pun yang membawakan demo ERP ini di depan calon klien: owner dan jajaran
direksi perusahaan air minum dalam kemasan (AMDK). Bacalah sekali sampai habis sebelum hari
presentasi, lalu gunakan bagian **Alur 7 langkah** sebagai contekan.

Panduan ini juga bisa dibuka langsung di aplikasi lewat alamat \`#/panduan\`, tombol **?** (Bantuan) di
bilah atas, atau tombol **Panduan** di pita mode presenter.

---

## 1. Inti pesan

**Kontrol dan visibilitas.** Owner melihat apa yang terjadi di seluruh cabang hari ini, menelusuri angka
sampai ke penyebabnya, lalu langsung memutuskan. Semuanya dari satu sistem, tanpa menunggu rekap Excel.

Tiga hal yang harus tertinggal di kepala audiens:

1. **Galon adalah aset yang berputar.** Sistem ini tahu setiap galon ada di tangan siapa.
2. **Satu input menggerakkan banyak modul.** Tidak ada lagi ketik ulang di beberapa file.
3. **Mulai kecil dan terukur.** Pilot satu cabang dengan kriteria sukses yang disepakati bersama.

Audiensnya bukan tim IT. Jangan menjelaskan teknologi. Tunjukkan, lalu biarkan layar yang berbicara.

---

## 2. Persiapan sebelum presentasi

- [ ] Buka demo di laptop yang akan disambungkan ke proyektor. Pakai Chrome atau Edge, layar penuh (F11).
- [ ] Untuk tanpa internet, pakai file \`erp-demo.html\`. Untuk dengan internet, pakai tautan GitHub Pages.
- [ ] **Muat ulang halaman** sesaat sebelum mulai, supaya semua angka dan transaksi kembali ke kondisi awal.
- [ ] Pastikan filter area di bilah atas berisi **Semua area (nasional)**.
- [ ] Pastikan sakelar di pojok kanan atas ada di posisi **Cara ERP**.
- [ ] Tekan **P** untuk memunculkan pita langkah demo, lalu **1** untuk ke langkah pertama.
- [ ] Coba sekali jalur langkah 2 dan 3 supaya tangan sudah hafal posisinya.
- [ ] Siapkan jawaban pertanyaan "tim berapa orang dan berapa lama?" **di luar** aplikasi (lihat bagian 6).

### Tombol mode presenter

| Tombol | Fungsi |
|---|---|
| **P** | Tampilkan atau sembunyikan pita langkah demo |
| **1–7** atau **← →** | Pindah ke langkah tertentu |
| **N** | Tampilkan atau sembunyikan catatan presenter (bawaan tersembunyi, aman untuk proyektor) |
| **R** | Reset demo ke kondisi awal |
| **Esc** | Tutup panel samping (drill-down) |

---

## 3. Alur 7 langkah

Perkiraan waktu total 20–25 menit, ditambah tanya jawab.

### Langkah 1 — Dashboard Manajemen (±3 menit)

**Buka:** halaman pembuka, Dashboard Manajemen.

**Tunjukkan:**
- Kartu emas **"Jika tidak bertindak · estimasi"** dengan angka biaya bocor per bulan.
- Daftar **Perlu keputusan hari ini**.
- Peta operasi dan enam indikator di bawahnya.

**Katakan:**
> "Ini layar pertama yang Bapak/Ibu lihat setiap pagi. Satu angka: berapa rupiah yang bocor bulan ini,
> dan keputusan apa yang menunggu."

**Tanyakan:**
> "Hari ini, berapa lama waktu yang dibutuhkan untuk mendapatkan angka ini?"

Biarkan mereka menjawab. Jawaban mereka adalah alasan pitch ini.

### Langkah 2 — Telusur susut / drill-down (±4 menit)

**Klik berurutan:** kartu **Galon susut** → **Plant Jakarta** → **Bekasi** → penyebab
**"Tidak kembali dari pelanggan"**. Halaman Galon tracker terbuka, sudah tersaring untuk galon hilang
di Bekasi.

**Katakan:**
> "Dari angka rupiah di layar direksi sampai ke daftar galon yang hilang, empat klik. Tidak ada yang
> perlu diminta ke cabang."

**Catatan:**
- Semua kartu di Dashboard Manajemen bisa ditelusuri dengan cara yang sama: piutang, kirim ulang, galon
  beredar, ketepatan kirim, armada, BPA, dan omzet.
- Di setiap tingkat, angka anak selalu berjumlah sama dengan angka induknya. Kalau ada yang menantang
  angkanya, telusuri saja bersama mereka.
- Opsional: buka satu kartu keputusan lewat **Lihat dasar keputusan**, lalu klik **Setujui** di panel.
  Angka bocor di kartu emas langsung turun dan "Sudah ditangani" bertambah.

### Langkah 3 — Antar Rumah (±4 menit)

**Buka:** Sales & Distribusi → **Antar Rumah**.

**Klik:** pengiriman **Klinik Sehat Sentosa** (Bekasi, rute R-07) → tombol **Konfirmasi serah terima**.

**Tunjukkan:** panel **Jejak integrasi**, yang menyatakan "1 input ini menggerakkan N modul": stok gudang
berkurang, piutang dan deposit bertambah, status aset galon berubah, progres rute bertambah.

**Katakan:**
> "Driver cukup menekan satu tombol. Gudang, keuangan, aset, dan laporan ikut bergerak saat itu juga.
> Hari ini, transaksi yang sama diketik ulang di beberapa file."

Klinik Sehat Sentosa dipilih karena menambah satu galon, sehingga deposit ikut naik dan dampaknya
terlihat lebih jelas.

### Langkah 4 — Galon berseri (±3 menit)

**Buka:** ketik \`GLN-19L-048213\` di kotak cari di bilah atas lalu tekan Enter, atau tekan **4** di mode
presenter. Galon ini dipegang Ibu Retno Wulandari di Bekasi.

**Tunjukkan:** riwayat galon dibaca dari atas ke bawah: dicuci dan QC di pabrik, diisi pada batch tertentu,
dimuat ke rute, lalu **berakhir di nama pelanggan**.

**Katakan:**
> "Sistem tahu galon ini sekarang ada di tangan siapa, sudah berputar berapa kali, dan kapan harus pensiun."

Ini **momen kunci** demo. Beri jeda. Jangan buru-buru pindah.

### Langkah 5 — Kepatuhan BPA 2031 (±3 menit)

**Buka:** Inventory → **Compliance BPA 2031**.

**Klik:** geser slider rencana penggantian galon per bulan.

**Katakan:**
> "Aturan BPOM soal BPA berlaku penuh 1 Juli 2031. Dengan data umur dan siklus setiap galon, rencana
> penggantian bisa dihitung dari data, bukan perkiraan."

### Langkah 6 — Cara Excel (±2 menit)

**Klik:** sakelar di pojok kanan atas ke **Cara Excel**, di Dashboard Manajemen.

**Tunjukkan:** angka bocor berubah menjadi **"tidak diketahui"**. Layar lain menampilkan transaksi yang
sama diketik ulang di beberapa file, dengan jeda beberapa hari, dan satu baris merah *"selisih stok:
N galon, tidak diketahui penyebabnya"*.

**Katakan:**
> "Ini kondisi hari ini. Bukan karena timnya kurang rajin, tetapi karena datanya terpisah-pisah."

Kembalikan sakelar ke **Cara ERP** setelahnya.

### Langkah 7 — Langkah berikutnya (±3 menit)

**Buka:** halaman **Langkah berikutnya**.

**Tunjukkan:** empat fase, mulai dari **fase 0 (penemuan)** dan **pilot satu cabang**, beserta kriteria
sukses pilot.

**Katakan:**
> "Kami tidak meminta Bapak/Ibu mengganti semua sistem sekaligus. Mulai dari satu cabang, ukur hasilnya,
> lalu putuskan."

Tutup dengan ajakan konkret: jadwal sesi fase 0 untuk mengonfirmasi angka dasar.

---

## 4. Bahan cerita

### Masalah yang dijawab

| Kondisi hari ini | Akibatnya |
|---|---|
| Satu transaksi diketik ulang di beberapa file oleh orang yang berbeda | Angka antarbagian tidak sama, butuh berhari-hari untuk mencocokkannya |
| Galon tercatat sebagai jumlah, bukan per nomor seri | Selisih stok diketahui, tetapi tidak diketahui penyebab dan lokasinya |
| Deposit galon dicatat terpisah dari stok | Liabilitas deposit tidak cocok dengan galon yang benar-benar ada di pelanggan |
| Rekap untuk direksi dibuat manual tiap akhir periode | Keputusan diambil berdasarkan data yang sudah berumur beberapa hari |
| Umur dan jumlah siklus galon tidak terlacak | Sulit menyusun rencana penggantian galon menuju 2031 |

### Keunggulan

1. **Dirancang khusus untuk galon guna ulang** (di dunia ERP disebut *Returnable Packaging Management*),
   dilacak per nomor seri.
2. **Satu input, banyak modul.** Tidak ada ketik ulang.
3. **Angka yang bisa ditelusuri** dari layar direksi sampai ke galon, rute, dan pelanggan.
4. **Siap regulasi** BPA 2031.
5. **Keputusan, bukan hanya laporan.** Dashboard menyodorkan tindakan beserta estimasi dampaknya.
6. **Bertahap dan terukur**, dimulai dari satu cabang.

### Keuntungan bagi perusahaan

| Area | Yang didapat |
|---|---|
| Kerugian galon | Galon hilang dan rusak bisa dilacak ke cabang, rute, dan pelanggan |
| Arus kas | Piutang dan deposit tercatat saat serah terima; piutang lewat 30 hari terlihat lebih awal |
| Biaya distribusi | Kirim ulang dan rute yang meleset terpantau per hari |
| Waktu tim | Rekonsiliasi stok dan piutang dari hitungan hari menjadi menit |
| Kepatuhan | Rencana penggantian galon menuju 2031 disusun dari data nyata |
| Pengambilan keputusan | Direksi melihat posisi seluruh cabang setiap pagi |

### Rencana pengembangan

| Fase | Isi | Yang diukur |
|---|---|---|
| 0 — Penemuan | Konfirmasi angka dasar, petakan sistem yang berjalan, pilih cabang pilot dan cara penandaan galon | Angka dasar susut, selisih stok, waktu rekonsiliasi |
| 1 — Pilot satu cabang | Nomor seri galon di satu gudang, aplikasi serah terima driver, dashboard cabang; berjalan paralel dengan Excel | Susut cabang pilot, ketepatan kirim, waktu rekonsiliasi |
| 2 — Jabodetabek | Semua gudang dan rute Jabodetabek, piutang dan deposit terhubung ke Finance | Susut wilayah, piutang lewat 30 hari, kesiapan BPA |
| 3 — Nasional | Cabang dan pabrik lain, QC dan pencucian galon, modul pendukung sesuai prioritas | Kesehatan cabang, waktu dari kejadian ke tindakan |

**Kriteria sukses pilot (usulan untuk dibahas):** susut cabang pilot turun dari angka dasar, rekonsiliasi
stok turun dari hari ke menit, 100% galon di gudang pilot berseri, dan direksi melihat posisi cabang
pilot tanpa menunggu rekap Excel.

---

## 5. Tentang angka di dalam demo

- Semua nama pelanggan, driver, nomor seri, dan transaksi adalah **contoh**.
- Angka skala (galon beredar ±1,8 juta, ±104 ribu galon diantar per hari, 512 armada, susut, piutang)
  adalah **estimasi dari angka acuan dan asumsi**, bukan data internal perusahaan.
- Estimasi biaya bocor nasional sekitar **Rp400 juta per bulan** juga asumsi.
- Kalau audiens punya angka sendiri, buka tombol **Asumsi** di pojok kanan atas dan masukkan
  perkiraan mereka. Seluruh layar akan menghitung ulang. Ini cara terbaik untuk mengubah keberatan
  menjadi keterlibatan.
- Selalu sebut angka sebagai **"estimasi"**. Jangan pernah mengklaim angka itu milik perusahaan mereka.

---

## 6. Pertanyaan yang mungkin muncul

**"Angkanya dari mana?"**
Dari angka acuan publik dan asumsi yang wajar. Tunjukkan tombol Asumsi dan ajak mereka memasukkan
angka sendiri. Angka sebenarnya ditetapkan bersama di fase 0.

**"Ini dikerjakan tim berapa orang, dan berapa lama?"**
Jawab di luar aplikasi, dengan jawaban yang sudah disiapkan. Jangan berimprovisasi. Tekankan bahwa
durasi tiap fase disepakati setelah fase 0, ketika kebutuhan dan sistem yang berjalan sudah dipahami.

**"Bagaimana galonnya diberi nomor seri?"**
Opsinya, misalnya, kode QR atau barcode cetak laser pada galon. Dipilih bersama di fase 0 sesuai proses
pabrik.

**"Apakah sistem lama harus dibuang?"**
Tidak harus. Pilot berjalan paralel dengan Excel, dan integrasi dengan sistem yang sudah ada dibahas di
fase 0.

**"Driver di lapangan sinyalnya jelek."**
Aplikasi driver di versi produksi dirancang tetap bisa dipakai saat sinyal lemah dan menyinkronkan data
ketika tersambung.

**"Apakah ini sudah jadi?"**
Belum. Ini prototipe untuk menyamakan gambaran. Data di dalamnya contoh, dan memuat ulang halaman
mengembalikan semuanya ke kondisi awal.

---

## 7. Yang perlu dihindari

- Jangan menyebut angka demo sebagai angka perusahaan mereka.
- Jangan membuka layar teknis atau membicarakan bahasa pemrograman.
- Jangan menjanjikan tanggal selesai atau ukuran tim di depan layar.
- Jangan terburu-buru di langkah 3 dan 4. Di situlah integrasi terasa.
